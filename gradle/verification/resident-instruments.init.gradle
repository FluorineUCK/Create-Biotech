gradle.projectsEvaluated {
    def p = gradle.rootProject
    def verification = p.sourceSets.create('residentInstrumentGameTest') {
        java.srcDir 'src/test/java'
        resources.srcDir 'src/test/resources'
        resources.include 'data/create_biotech_instruments/**'
        ['BiocomputingWorldGameTests', 'BiocomputingFlowOwnerGameTests', 'BiocomputingFlowFixture', 'BiocomputingClusterXBusGameTests', 'VindicatorSequencerGameTests', 'FisherListenerGameTests', 'BiocomputingResidentInstallGameTests'].each {
            java.include "com/nobodiiiii/createbiotech/content/biocomputing/gametest/${it}.java"
        }
        java.include "com/nobodiiiii/createbiotech/content/biocomputing/network/serial/ResidentRadioWorldGameTests.java"
        java.include "com/nobodiiiii/createbiotech/content/biocomputing/network/serial/ResidentCarrierWorldGameTests.java"
        java.include "com/nobodiiiii/createbiotech/content/biocomputing/network/serial/ResidentCarrierLifecycleGameTests.java"
        compileClasspath += p.sourceSets.main.output
        runtimeClasspath += p.sourceSets.main.output
    }
    ['implementation', 'compileOnly', 'runtimeOnly'].each {
        p.configurations.getByName(verification."${it}ConfigurationName").extendsFrom(p.configurations.getByName(it))
    }
    def neo = p.extensions.getByName('neoForge')
    neo.addModdingDependenciesTo(verification)
    neo.mods.named('create_biotech') { sourceSet verification }
    def directory = p.file('.superpowers/cache/resident-instruments-native-game')
    neo.runs.named('gameTestServer') {
        gameDirectory = directory
        systemProperty 'neoforge.gameTestServer', 'true'
        systemProperty 'neoforge.enabledGameTestNamespaces', 'create_biotech_instruments'
        jvmArguments.add('-Xmx2G')
    }
    p.tasks.named('runGameTestServer') {
        workingDir = directory
        doFirst { task ->
            if (task.workingDir.canonicalFile != directory.canonicalFile) throw new GradleException('Wrong resident instrument test directory')
        }
    }
}





